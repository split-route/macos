name: release
# Tag vX.Y.Z: build the app, publish the DMG as a GitHub release and update the Homebrew cask in the tap.
# A tag with a dash (v1.2.0-rc1) is a pre-release: it is published but the cask is left alone.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    # The app uses macOS 26 APIs (Liquid Glass), so it is built with the macOS 26 SDK.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          # go.sum is in daemon/, not at the root where setup-go looks: without this nothing is cached. A tag's run restores
          # the cache that CI filled on main (it builds the service with the same flags).
          cache-dependency-path: daemon/go.sum

      - name: Version
        id: v
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) echo "pre=true" >> "$GITHUB_OUTPUT" ;; *) echo "pre=false" >> "$GITHUB_OUTPUT" ;; esac

      # No test step: CI already ran the tests on this commit when it was pushed to main. Tag a commit CI has passed.
      # The build below still uses the published core (go.mod), never a sibling checkout.

      # The app is signed with the self-signed certificate from scripts/make-signing-cert.sh, so every release has the same
      # identity (an ad-hoc one changes with every build). Secrets: SIGNING_P12_BASE64 (`base64 -i backup.p12`) and
      # SIGNING_P12_PASSWORD (its passphrase).
      - name: Import the signing certificate
        env:
          P12: ${{ secrets.SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: |
          [ -n "$P12" ] && [ -n "$P12_PASSWORD" ] || { echo "SIGNING_P12_BASE64 and SIGNING_P12_PASSWORD must be set" >&2; exit 1; }
          kc="$RUNNER_TEMP/signing.keychain-db"
          pw=$(uuidgen)
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/id.p12"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          security import "$RUNNER_TEMP/id.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign >/dev/null
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pw" "$kc" >/dev/null
          rm -f "$RUNNER_TEMP/id.p12"
          # In the search list, not passed with codesign --keychain: on the macOS 26 runner that finds no identity for a
          # self-signed certificate (see signing-check), while the search list does.
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | sed 's/"//g')

      # The DMG tool's Python environment is the same every time; the image version is in the key because the
      # environment points at the image's Python.
      - name: Image version
        id: image
        run: echo "version=$ImageVersion" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .build/dmgbuild-venv
          key: dmgbuild-1.6.7-${{ runner.os }}-${{ runner.arch }}-${{ steps.image.outputs.version }}

      - name: Build the app and the DMG
        env:
          VERSION: ${{ steps.v.outputs.version }}
          GOWORK: "off"
          REQUIRE_SIGNING_CERT: "1" # a release is never signed ad hoc: that would change the app's identity
        run: ./build-app.sh

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      - name: Name the DMG and the zip and checksum them
        id: dmg
        run: |
          dmg="Splitroute_${{ steps.v.outputs.version }}_macos.dmg"
          zip="Splitroute_${{ steps.v.outputs.version }}_macos.zip"
          mv build/Splitroute.dmg "build/$dmg"
          mv build/Splitroute.zip "build/$zip"
          (cd build && shasum -a 256 "$zip" > "$zip.sha256")
          echo "zip=build/$zip" >> "$GITHUB_OUTPUT"
          (cd build && shasum -a 256 "$dmg" > "$dmg.sha256")
          echo "file=build/$dmg" >> "$GITHUB_OUTPUT"
          echo "sha=$(cut -d' ' -f1 "build/$dmg.sha256")" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          ## Install

          ```sh
          brew install --cask split-route/tap/splitroute
          ```

          Or download the DMG below and drag Split Route to Applications. The app is not notarized: the first time, allow
          it in System Settings > Privacy & Security, and the service under General > Login Items. Needs macOS 14 or later.

          ## Changes

          NOTES
          flags=""
          [ "${{ steps.v.outputs.pre }}" = true ] && flags="--prerelease"
          gh release create "$GITHUB_REF_NAME" $flags --title "Split Route ${{ steps.v.outputs.version }}" \
            --notes-file notes.md --generate-notes \
            "${{ steps.dmg.outputs.file }}" "${{ steps.dmg.outputs.file }}.sha256" \
            "${{ steps.dmg.outputs.zip }}" "${{ steps.dmg.outputs.zip }}.sha256"

      - name: Update the Homebrew cask
        if: steps.v.outputs.pre == 'false'
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: scripts/update-cask.sh "${{ steps.v.outputs.version }}" "${{ steps.dmg.outputs.sha }}"
