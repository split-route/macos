name: signing-check
# Imports the signing certificate from the secrets and signs a dummy binary, the way the release does. Run it by hand
# (Actions > signing-check > Run workflow) after changing the certificate or the release's signing steps: it takes a minute,
# a release takes ten. It tries each way of naming the identity and prints what each one does.
on: workflow_dispatch

jobs:
  check:
    runs-on: macos-26
    steps:
      - name: Import the signing certificate
        env:
          P12: ${{ secrets.SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: |
          [ -n "$P12" ] && [ -n "$P12_PASSWORD" ] || { echo "SIGNING_P12_BASE64 and SIGNING_P12_PASSWORD must be set" >&2; exit 1; }
          kc="$RUNNER_TEMP/signing.keychain-db"
          pw=$(uuidgen)
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/id.p12"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          security import "$RUNNER_TEMP/id.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pw" "$kc" >/dev/null
          rm -f "$RUNNER_TEMP/id.p12"
          echo "KC=$kc" >> "$GITHUB_ENV"
      - name: Try the ways of signing
        run: |
          sw_vers
          echo "--- identities in the keychain"
          security find-identity -p codesigning "$KC"
          security find-identity -v -p codesigning "$KC"
          printf 'int main(){return 0;}' > t.c && cc t.c -o t
          hash=$(security find-identity -p codesigning "$KC" | sed -n 's/.*\([0-9A-F]\{40\}\).*Splitroute Signing.*/\1/p' | head -1)
          echo "hash: $hash"
          try() { echo "=== $1"; shift; cp t t.x; "$@" t.x 2>&1 | tail -3; codesign -dr - t.x 2>&1 | tail -1; }
          try "1 name, --keychain" codesign --force --keychain "$KC" --sign "Splitroute Signing"
          try "3 hash, --keychain" codesign --force --keychain "$KC" --sign "$hash"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | sed 's/"//g')
          try "2 name, in the search list" codesign --force --sign "Splitroute Signing"
          try "4 hash, in the search list" codesign --force --sign "$hash"
          echo "=== 5 trusted for code signing"
          security find-certificate -c "Splitroute Signing" -p "$KC" > cert.pem
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain cert.pem 2>&1 | tail -2
          security find-identity -v -p codesigning "$KC"
          try "5 name, trusted" codesign --force --keychain "$KC" --sign "Splitroute Signing"
      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$KC" || true
